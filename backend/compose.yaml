services:
  database:
    image: postgres:17
    container_name: narcology-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: narcology
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes: 
  postgres_data: